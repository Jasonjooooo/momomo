# =============================================================================
# 云执照飞行记录录入步骤配置
# =============================================================================
# 已按「云执照 com.ccar.apk · 135飞机单发陆地-航班飞行」页面的控件编号(id)配置。
# 标 TODO 的是还没确认交互方式的字段，目前先暂停让你手动操作。
# 其他页面/版本如有不同，按下面方法调整：
#    1. 在手机上打开云执照，进入「新增飞行记录」页面
#    2. 电脑运行：python filler.py dump
#    3. 对照打印出来的文字，修改下面的 text / label
#    4. 先用 --dry-run 预览，再用 --limit 1 实际录一条试试
#
# 可用动作：
#   click: "按钮文字"                    点击文字完全相同的控件
#   click: {text_contains: "新增"}       点击包含该文字的控件
#   click_if_exists: "我知道了"          有弹窗就点掉，没有就跳过
#   fill:  {label: "起飞地点", column: "起飞地点"}
#          找到标签「起飞地点」旁边的输入框，填入数据中「起飞地点」那一列
#   select: {label: "机型", column: "机型"}
#          点开「机型」选择框，再点与数据值同名的选项（会自动上下滚动查找）
#   wait: 1.5                            等待秒数
#   back: null                           按返回键
#   hide_keyboard: null                  收起键盘
#   wheel: {open: {label: "飞行日期"}, column: "飞行日期"}
#          点开日期/时间滚轮，把每一列拨到对应的值，再点「确定」（详见下方说明）
#   manual: "请选择起飞地点 {起飞地点}"     暂停，让你在手机上手动操作后按回车
#                                        （地图选点等难以自动化时用）
#
# 定位控件的方式（任选一种，写在 click / fill / select 里）：
#   text: 完全相同的文字        text_contains: 包含文字
#   label: 表单左侧/上方的标签文字（fill 时自动找它旁边的输入框）
#   hint: 输入框里的灰色提示，如 "请输入起飞地点"
#   id: 控件 resource-id（dump 能看到）
#   input_index: 当前屏幕第几个输入框（从 0 开始，最后的手段）
#
# 取值方式：
#   column: "列名"                       直接取该列
#   value: "{起飞时间}-{降落时间}"         组合多列
#   map: {"训练": "训练飞行"}             把数据里的值换成 App 里的选项文字
#   only_if: "备注"                      仅当该列不为空时才执行此步
#   （fill/select/wheel 遇到空值会自动跳过）
#
# wheel（滚轮）的可选参数：
#   open:     先点击哪个控件打开滚轮（写法同 click）
#   confirm:  拨好后点的按钮，默认 "确定"；写 "" 表示不点
#   wheels:   值的每一段对应第几列滚轮（从 0 开始）。默认 [0,1,2...]
#             例：滚轮是「年 月 日 时 分」5 列，只填时间 "09:30" → wheels: [3, 4]
#   pattern:  自定义拆分值的正则，如 "(上午|下午)\\s*(\\d+):(\\d+)"；默认按数字拆
#   read:     auto(默认，先读界面文字，读不到用 OCR) | text | ocr | blind
#   area:     滚轮区域 [x1, y1, x2, y2]，像素或 0~1 比例；自动识别不准时填写
#   count:    area 里有几列（默认=需要的列数）  weights: 各列宽度比例，如 [2,1,1]
#   center_y: 选中线的纵坐标（默认取区域中心）
#   item_height / visible_items: 每格高度(px) / 可见行数（默认 5），读不到格高时使用
#   initial:  读不到任何内容时，按初始值盲拨，如 "now"（手机当前时间）或 "2026-01-01"
#   settle:   读数前等待滚轮停稳的秒数，默认 0.3
#   cyclic:   循环滚轮每列的格数（59 后面接 00 的那种），如 [24, 60]；可走更短/更好拖的方向
#   drag_mode: adb(默认，最快) | swipe | touch       hold: 松手前停顿秒数（默认 0.2）
#   offscreen: true 往下拖时允许手指拖出屏幕，一次拖更多格（部分手机不支持）
# =============================================================================

settings:
  find_timeout: 5     # 找控件最多等几秒
  max_scrolls: 6      # 找不到时最多上下滚动几次
  step_delay: 0.5     # 每步之后停顿几秒（手机慢就调大）
  fast: true          # 用 adb 点击 + 输入法广播输入（快）；有问题时改 false 退回 uiautomator（慢）

# 每条记录开始前：进入新增页面
# TODO：确认从列表页进入「135飞机单发陆地-航班飞行」新增页面的按钮后再填写。
#       目前留空 = 需要你事先停在新增页面上。
before_each: []

# 填写表单（id 来自 dump 输出）
record_steps:
  # id 是控件编号；label 是该行左侧的文字，id 找不到时（App 网页在输入状态下会隐藏相邻输入框的 id）按 label 定位
  - manual: "TODO 请手动选择【日期】{日期}"
  - fill:   {id: "AIRNUM",    label: "航班号",       column: "航班号"}
  - fill:   {id: "AIRMODEL",  label: "航空器型号",   column: "航空器型号"}
  - fill:   {id: "AIRREGNUM", label: "航空器登记号", column: "航空器登记号"}
  - fill:   {id: "TAKEADD",   label: "起飞站",       column: "起飞站"}
  - fill:   {id: "ARRVADD",   label: "降落站",       column: "降落站"}
  - hide_keyboard: null
  # 时/分滚轮（H5 自绘，靠 OCR 读数，需安装 rapidocr_onnxruntime）
  - wheel:  {open: {id: "TAKETIME-time", label: "出发时刻"}, column: "出发时刻", confirm: "确定", offscreen: true}
  - wheel:  {open: {id: "ARRVTIME-time", label: "到达时刻"}, column: "到达时刻", confirm: "确定", offscreen: true}
  # 下拉框：点 _dummy（显示当前值的那个框）；选项文字只要包含表格里的值即可，如「机长」
  - select: {id: "JOB_dummy",        label: "职位",     column: "职位"}
  - select: {id: "YIBIAOTYPE_dummy", label: "进近方式", column: "进近方式"}
  # 以下时间字段若与出发时刻是同一种滚轮即可自动；表格里留空则跳过
  - wheel:  {open: {id: "JINGLITIME",     label: "飞行经历时间"},     column: "飞行经历时间", confirm: "确定", offscreen: true}
  - wheel:  {open: {id: "YEJIANTIME",     label: "夜间飞行经历时间"}, column: "夜间飞行经历时间", confirm: "确定", offscreen: true}
  - wheel:  {open: {id: "YIBIAOTIME",     label: "真实仪表时间"},     column: "真实仪表时间", confirm: "确定", offscreen: true}
  - wheel:  {open: {id: "ZHUANCHANGTIME", label: "转场时间"},         column: "转场时间", confirm: "确定", offscreen: true}
  - fill:   {id: "ZHUOLUZHOUJIAN", label: "昼间", column: "昼间着陆次数"}
  - fill:   {id: "ZHUOLUYEJIAN",   label: "夜间", column: "夜间着陆次数"}
  - fill:   {id: "REMARK",         label: "备注", column: "备注"}
  - hide_keyboard: null

# 提交（逐条确认模式下，你按回车后才会执行）
submit_steps:
  - click: {id: "subbtn"}               # 页面底部「保  存」按钮
  - wait: 2

# 每条成功后
after_each: []

# 逐条确认时选择「跳过」后执行（目前不做任何操作，由你在手机上处理）
on_skip: []
