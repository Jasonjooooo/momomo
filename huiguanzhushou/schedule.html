<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发帖排期表 · 回关助手</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #0f1419; --mute: #536471; --line: #dde3e8; --field: #f7f9fa;
    --blue: #1d9bf0; --green: #00875a; --amber: #b26b00; --red: #d42230; --soft: #e8f5fe;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0f14; --card: #15202b; --ink: #eef2f5; --mute: #8b98a5; --line: #2f3d4a; --field: #0f1923;
      --blue: #1d9bf0; --green: #00ba7c; --amber: #ffad1f; --red: #f4212e; --soft: #10273a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 22px; }
  h2 { margin: 0; font-size: 15px; }
  .lede { margin: 4px 0 0; color: var(--mute); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .settings { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mute); font-weight: 600; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .switch { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding-bottom: 6px; }
  .switch input { width: auto; }
  button { font: inherit; cursor: pointer; border-radius: 999px; padding: 6px 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); white-space: nowrap; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--mute); }
  .summary b { color: var(--ink); font-size: 15px; }
  .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .msg { font-size: 13px; color: var(--mute); }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
  details.card > summary { cursor: pointer; font-weight: 700; font-size: 15px; }
  details.card[open] > summary { margin-bottom: 4px; }
  #bulk { width: 100%; min-height: 90px; resize: vertical; }

  /* 两栏：左边格子列表，右边编辑 + 预览 */
  .work { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .list { padding: 6px; gap: 0; max-height: calc(100vh - 40px); overflow-y: auto; position: sticky; top: 16px; }
  /* 24 小时表格 */
  .hrow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; align-items: stretch; padding: 3px 4px; border-radius: 8px; }
  .hrow.now { background: var(--soft); }
  .hlab { font-size: 12px; font-weight: 700; color: var(--mute); font-variant-numeric: tabular-nums; padding-top: 8px; text-align: right; }
  .hrow.now .hlab { color: var(--blue); }
  .cells { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 4px; }
  .cell {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; min-height: 44px;
    text-align: left; padding: 4px 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  }
  .cell:hover { border-color: var(--mute); }
  .cell .cm { font-size: 11px; font-weight: 700; color: var(--mute); font-variant-numeric: tabular-nums; }
  .cell .cs { font-size: 12px; line-height: 1.35; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .cell .ci { position: absolute; top: 3px; right: 6px; font-size: 11px; font-weight: 800; }
  .cell.past:not(.has) { opacity: 0.35; }
  .cell.has { background: var(--soft); border-color: var(--blue); }
  .cell.has .cm { color: var(--blue); }
  .cell[draggable="true"] { cursor: grab; }
  .cell.dragging { opacity: 0.4; }
  .cell.drop-ok { outline: 2px dashed var(--blue); outline-offset: 1px; }
  .cell.drop-no { outline: 2px dashed var(--red); outline-offset: 1px; cursor: not-allowed; }
  .mv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); }
  .mv-row input, .mv-row select { font: inherit; }
  .cell.st-sent { background: rgba(0, 186, 124, 0.12); border-color: var(--green); }
  .cell.st-sent .cm, .cell.st-sent .ci { color: var(--green); }
  .cell.st-missed { background: rgba(244, 33, 46, 0.08); border-color: var(--red); }
  .cell.st-missed .cm, .cell.st-missed .ci { color: var(--red); }
  .cell.st-reminded, .cell.st-opened { border-color: var(--amber); }
  .cell.sel { outline: 2px solid var(--blue); outline-offset: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--mute); padding: 4px 6px 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }
  .pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 7px; border: 1px solid var(--line); color: var(--mute); }
  .pill.wait { color: var(--blue); border-color: var(--blue); }
  .pill.reminded, .pill.opened { color: var(--amber); border-color: var(--amber); }
  .pill.sent { color: #fff; background: var(--green); border-color: var(--green); }
  .pill.missed { color: var(--red); border-color: var(--red); }

  .editor { position: sticky; top: 16px; }
  .ed-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ed-head h2 { font-size: 17px; }
  .ed-head .nav { margin-left: auto; display: flex; gap: 6px; }
  .ed-head .nav button { padding: 3px 11px; font-size: 12.5px; }
  .ed-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  #text { width: 100%; min-height: 180px; resize: vertical; font-size: 15px; line-height: 1.5; }
  .count { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); }
  .count .over { color: var(--amber); font-weight: 600; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .drop.over { border-color: var(--blue); background: var(--soft); }
  .thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; background: var(--field); }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .vtag { position: absolute; left: 4px; bottom: 4px; font-size: 10.5px; font-weight: 700; color: #fff; background: rgba(15, 20, 25, 0.75); border-radius: 4px; padding: 0 4px; }
  .thumb button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; padding: 0; line-height: 20px; border-radius: 50%;
    border: 0; background: rgba(15, 20, 25, 0.75); color: #fff; font-size: 14px; }
  .thumb .mv { top: auto; bottom: 3px; right: auto; left: 3px; font-size: 12px; }
  .drop .hint { font-size: 12px; color: var(--mute); flex: 1; min-width: 140px; }
  .ed-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .empty-ed { color: var(--mute); text-align: center; padding: 40px 0; }

  /* 预览：仿 X 的帖子样子 */
  .pv-wrap { display: flex; flex-direction: column; gap: 6px; }
  .pv-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--mute); font-weight: 600; }
  .pv-bar button { padding: 2px 10px; font-size: 12px; }
  .tw {
    --tw-bg: #fff; --tw-ink: #0f1419; --tw-mute: #536471; --tw-line: #eff3f4; --tw-link: #1d9bf0;
    background: var(--tw-bg); color: var(--tw-ink); border: 1px solid var(--tw-line); border-radius: 12px;
    padding: 12px 16px 6px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 10px;
    font: 15px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .tw.dark { --tw-bg: #000; --tw-ink: #e7e9ea; --tw-mute: #71767b; --tw-line: #2f3336; }
  .tw .av { width: 40px; height: 40px; border-radius: 50%; background: #cfd9de center/cover no-repeat; }
  .tw .hd { display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; }
  .tw .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .tw .ck { width: 18px; height: 18px; flex: none; }
  .tw .hd .sub { color: var(--tw-mute); overflow: hidden; text-overflow: ellipsis; }
  .tw .tx { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .tw .tx a { color: var(--tw-link); text-decoration: none; }
  .tw .more { color: var(--tw-link); }
  .tw .tx.ph { color: var(--tw-mute); }
  .tw .media { margin-top: 12px; border: 1px solid var(--tw-line); border-radius: 16px; overflow: hidden; display: grid; gap: 2px; }
  .tw .media img, .tw .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tw .media.n1 video { max-height: 510px; height: auto; background: #000; object-fit: contain; }
  .tw .media.n1 img { max-height: 510px; height: auto; }
  .tw .media.n2 { grid-template-columns: 1fr 1fr; aspect-ratio: 16 / 9; }
  .tw .media.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 16 / 9; }
  .tw .media.n3 img:first-child { grid-row: 1 / 3; }
  .tw .media.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 16 / 9; }
  .tw .acts { grid-column: 2; display: flex; justify-content: space-between; color: var(--tw-mute); margin-top: 10px; padding-bottom: 6px; max-width: 425px; }
  .tw .acts svg { width: 18px; height: 18px; fill: currentColor; }
  .pv-note { font-size: 12px; color: var(--mute); }

  @media (max-width: 980px) {
    .work { grid-template-columns: 1fr; }
    .list, .editor { position: static; max-height: none; }
    .list { max-height: 520px; }
  }
  @media (max-width: 700px) { .ed-cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>发帖排期表</h1>
    <p class="lede">左边是全天 24 小时的表格，一行一个小时。选一个格子，右边写帖子、加图片，旁边实时预览发出去的样子。写好后「交给 X 定时」（到点 X 自己发，电脑可以关），或者等到点提醒你自己发。</p>
  </header>

  <section class="card" aria-labelledby="h-set">
    <h2 id="h-set">设置</h2>
    <div class="settings">
      <label class="f">日期 <input type="date" id="date"></label>
      <label class="f">间隔
        <select id="step"><option value="10">10 分钟</option><option value="15">15 分钟</option><option value="20">20 分钟</option><option value="30">30 分钟</option><option value="60">1 小时</option></select>
      </label>
      <label class="switch"><input type="checkbox" id="on"> 到点提醒我</label>
      <label class="switch" title="交给 X 定时的时候，定时设好、图片传完后，倒数 3 秒自动帮你点「安排」。只会点「安排」，不会点「发帖」。"><input type="checkbox" id="auto"> 交给 X 后自动点「安排」</label>
    </div>
    <div class="summary" id="summary" role="status"></div>
    <div class="row-actions">
      <button type="button" class="primary" id="x-all">把这天还没发的都交给 X 定时</button>
      <span class="msg" id="x-msg" role="status"></span>
    </div>
  </section>

  <details class="card">
    <summary>批量填入文字</summary>
    <textarea id="bulk" placeholder="一次粘贴很多条，每条之间空一行。点下面的按钮，会按顺序填进还没到时间的空格子。图片之后再到右边一条条加。"></textarea>
    <div class="row-actions">
      <button type="button" class="primary" id="bulk-go">填进空格子</button>
      <span class="msg" id="bulk-msg" role="status"></span>
    </div>
  </details>

  <div class="work">
    <section class="card list" aria-label="24 小时排期表">
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--card)"></i>空</span>
        <span><i style="background:var(--soft);border-color:var(--blue)"></i>已写好</span>
        <span><i style="background:rgba(0,186,124,.15);border-color:var(--green)"></i>已发 / X 已定时</span>
        <span><i style="background:rgba(244,33,46,.1);border-color:var(--red)"></i>错过</span>
      </div>
      <div id="slots"></div>
    </section>

    <section class="card editor" id="editor" aria-label="编辑帖子">
      <div class="empty-ed" id="ed-empty">从左边选一个时间格子开始写。</div>
      <div id="ed" hidden>
        <div class="ed-head">
          <h2 id="ed-title"></h2>
          <span class="pill" id="ed-pill"></span>
          <div class="nav">
            <button type="button" id="prev" aria-label="上一格">↑ 上一格</button>
            <button type="button" id="next" aria-label="下一格">下一格 ↓</button>
          </div>
        </div>
        <div class="ed-cols" style="margin-top:12px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <textarea id="text" placeholder="写一条帖子…（可以直接粘贴图片）" aria-label="帖子内容"></textarea>
            <div class="count"><span id="count"></span><span id="count-tip"></span></div>
            <div class="drop" id="drop">
              <div id="thumbs" style="display:contents"></div>
              <button type="button" id="add-img">＋ 添加图片/视频</button>
              <span class="hint" id="img-hint">最多 4 张，或 1 张 GIF。也可以把图片拖到这里，或者在文字框里直接粘贴。</span>
              <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/quicktime" multiple hidden>
            </div>
            <div class="ed-actions">
              <button type="button" class="primary" id="to-x">交给 X 定时</button>
              <button type="button" id="send-now">现在发</button>
              <button type="button" id="clear">清空这格</button>
              <span class="msg" id="ed-msg" role="status"></span>
            </div>
            <div class="mv-row" id="mv-row">
              <span>移到</span>
              <input type="date" id="mv-date" aria-label="移到哪天">
              <select id="mv-time" aria-label="移到几点"></select>
              <button type="button" id="mv-go">移过去</button>
              <span class="hint">也可以直接在左边表格里把格子拖到别的时间；目标格子有内容就两条互换。</span>
            </div>
          </div>
          <div class="pv-wrap">
            <div class="pv-bar"><span>发出去的样子</span><button type="button" id="pv-theme">切换深色</button></div>
            <article class="tw" id="pv" aria-label="帖子预览">
              <div class="av" id="pv-av"></div>
              <div>
                <div class="hd"><span class="nm" id="pv-nm"></span>
                  <svg class="ck" id="pv-ck" viewBox="0 0 22 22" aria-label="已认证"><path fill="#1d9bf0" d="M20.4 11c0-1.3-.8-2.4-1.9-2.9.4-1.2.2-2.6-.7-3.5-.9-.9-2.3-1.1-3.5-.7C13.8 2.8 12.6 2 11.3 2s-2.4.8-2.9 1.9c-1.2-.4-2.6-.2-3.5.7-.9.9-1.1 2.3-.7 3.5C3.1 8.6 2.3 9.7 2.3 11s.8 2.4 1.9 2.9c-.4 1.2-.2 2.6.7 3.5.9.9 2.3 1.1 3.5.7.5 1.1 1.6 1.9 2.9 1.9s2.4-.8 2.9-1.9c1.2.4 2.6.2 3.5-.7.9-.9 1.1-2.3.7-3.5 1.1-.5 1.9-1.6 1.9-2.9z"/><path fill="#fff" d="M9.8 14.9 6.6 11.7l1.3-1.3 1.9 1.9 4.6-4.6 1.3 1.3z"/></svg>
                  <span class="sub" id="pv-sub"></span></div>
                <div class="tx" id="pv-tx"></div>
                <div class="media" id="pv-media" hidden></div>
              </div>
              <div class="acts" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M1.8 10c0-4.4 3.6-8 8-8h4.4c4.5 0 8.1 3.7 8.1 8.1 0 3-1.6 5.7-4.2 7.1L10 21.7V18.4h-.1C5.4 18.5 1.8 14.8 1.8 10zm8-6c-3.3 0-6 2.7-6 6 0 3.4 2.7 6.2 6.1 6.1h2.1v2.3l5.4-3c1.9-1 3.1-3.1 3.1-5.3 0-3.4-2.7-6.1-6.1-6.1H9.8z"/></svg>
                <svg viewBox="0 0 24 24"><path d="M4.5 3.9 8.9 8l-1.4 1.5-2-1.9V16c0 1.1.9 2 2 2H13v2H7.5c-2.2 0-4-1.8-4-4V7.6l-2 1.9L.1 8l4.4-4.1zM16.5 6H11V4h5.5c2.2 0 4 1.8 4 4v8.4l2-1.9 1.4 1.5-4.4 4.1-4.4-4.1 1.4-1.5 2 1.9V8c0-1.1-.9-2-2-2z"/></svg>
                <svg viewBox="0 0 24 24"><path d="M16.7 3.5c-1.7-.1-3.5.7-4.7 2.6-1.2-1.9-3-2.7-4.7-2.6-1.4.1-2.8.7-3.8 1.8-2.3 2.6-1.5 6.5 1.2 9.2l7.3 6.8 7.3-6.8c2.7-2.7 3.5-6.6 1.2-9.2-1-1.1-2.4-1.7-3.8-1.8z"/></svg>
                <svg viewBox="0 0 24 24"><path d="M8.8 20h-2V10h2v10zm5 0h-2V4h2v16zm5 0h-2v-7h2v7zm-10 0h-2V10h2v10z"/></svg>
                <svg viewBox="0 0 24 24"><path d="M4 4.5C4 3.1 5.1 2 6.5 2h11C18.9 2 20 3.1 20 4.5v18.4l-8-5.7-8 5.7V4.5zM6.5 4c-.3 0-.5.2-.5.5v14.6l6-4.3 6 4.3V4.5c0-.3-.2-.5-.5-.5h-11z"/></svg>
              </div>
            </article>
            <div class="pv-note" id="pv-note">名字和头像来自你上次打开 X 时的账号。实际效果以 X 为准。</div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="media-db.js"></script>
<script src="schedule.js"></script>
</body>
</html>
