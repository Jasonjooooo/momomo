# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 飞行天气简报配置（数据源：Windy Point Forecast API）
# ⚠️ 模式预报，仅作辅助参考，不能代替官方航空气象资料和放行讲解
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 预报模式：国内请用 gfs（iconEu、arome 等区域模式不覆盖中国）
model: gfs

# 时区（用于显示），以及从当前时刻起要看多少小时
timezone: Asia/Shanghai
hours_ahead: 6
# 每隔几小时取一个时次（GFS 为 3 小时间隔）
step_hours: 3

# 高空层（Windy 气压层 → 近似高度）
#   850h≈FL050  700h≈FL100  600h≈FL140  500h≈FL180  400h≈FL240  300h≈FL300
levels:
  - 700h
  - 500h
  - 400h

# 短报文单条最大字数（北斗短报文请按你的终端限制修改）
sms_max_len: 70

# 关注点：机场或航路点。坐标为近似值，请自行核对
points:
  - id: ZBHH
    name: 呼和浩特白塔
    lat: 40.851
    lon: 111.824
  - id: ZBOW
    name: 包头东河
    lat: 40.560
    lon: 109.997
  - id: ZBDS
    name: 鄂尔多斯伊金霍洛
    lat: 39.490
    lon: 109.861
